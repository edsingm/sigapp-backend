name: Setup PHP and Composer
description: Install the project PHP toolchain and locked Composer dependencies.
inputs:
  extensions:
    description: Comma-separated PHP extensions.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
      with:
        php-version: '8.4'
        extensions: ${{ inputs.extensions }}
        coverage: none
    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Composer dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-composer-
    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
